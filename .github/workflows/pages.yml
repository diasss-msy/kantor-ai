name: pages

# Membangun dan menerbitkan kantor 3D ke GitHub Pages setiap ada push ke main
# (termasuk setiap laporan baru). Deploy hanya berjalan kalau repo sudah publik
# dan Pages sudah dinyalakan dengan Source: GitHub Actions (Task 7).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bangun:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/cek_laporan.py
      - run: mkdir -p _site && cp -r kantor/. _site/
      - run: python tools/bangun_data.py . _site/data.json
      - run: rm -f _site/*.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
